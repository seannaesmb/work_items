# ! Default image being used for all jobs unless overridden in a job
# * This image is built from https://gitlab-api.c2sf.mil/cmis/cmis-codereview.git [codereview] branch
# * Runs once a week and pushes the built docker image to docker-registry.c2sf.mil/cmis/rockylinux:latest
default:
  image: docker-registry.c2sf.mil/cmis/rockylinux:latest

workflow:
  rules:
    # ! Conditions to not run the pipeline
    # * Merge request event && (Title starts with "Revert" || Source branch starts with "revert-")
    # * Merge request event
    # * Commit title starts with "Merge branch"
    # * Merge request source branch starts with "generated" [gerrit-generated-dev]
    # * Commit title starts with "Merge <branch> into"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TITLE =~ /^Revert "/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^revert-/) || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TITLE =~ /^Merge\s+[bB]ranch/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^\S+generated\S+$/ || $CI_COMMIT_TITLE =~ /^Merge\s+\S+\sinto/ '
      when:
        never
        # - if: '$CI_COMMIT_BRANCH == "test-gerrit-generate-dev" && $CI_COMMIT_TITLE =~ /^Merge\s+[bB]ranch/'
        # - if: '$CI_COMMIT_TITLE =~ /^Merge\s+[bB]ranch/'
        # - if: '$CI_COMMIT_BRANCH == "test-gerrit-generate-dev" && $CI_COMMIT_TITLE =~ /^Merge/'
    - when: always

stages: # List of stages for jobs, and their order of execution
  - merge_commit_creation
  - fortify
  - auto_approve_artifact
  - jira_ticket_link_apply
  - security
  - internal_code_scanners
  - report

variables:
  FPRNAME: fpr_report.fpr
  GITLAB_URL: "https://gitlab.c2sf.mil"
  PROJECT_ID: "CMIS"
  MR_IID: $CI_MERGE_REQUEST_IID
  MR_ID: $CI_MERGE_REQUEST_ID
  JIRA_BASE_URL: "https://jira.c2sf.mil"

  VERSION: $CI_COMMIT_REF_NAME
  FF_SCRIPT_SECTIONS: "true"
  AST_ENABLE_MR_PIPELINES: "true"

merge_creation:
  stage: merge_commit_creation
  script:
    - |
      JIRA_KEY=$(git log -1 --pretty=%B | grep -oE 'CMIS-[0-9]+' | head -1)
      if [ -z "${JIRA_KEY}" ]; then
        echo "ERROR: No CMIS-<number> key found in branch/commit — failing job"
      exit 1
        fi
      echo "Starting items -----"
      SUMMARY="${SUMMARY}"                        # from first commit subject or Jira ticket summary
      SOURCE_BRANCH="${CI_COMMIT_REF_NAME}"
      SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
      echo "Checking existing MR's"
      # Check for any existing MR (open or merged) from this source branch targeting test-gerrit-generate-dev
      EXISTING_MRS=$(curl --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${SOURCE_BRANCH}&target_branch=test-gerrit-generate-dev&state=all")
      echo ${EXISTING_MRS}

      echo "Counting now ---"
      # Count how many merged MRs already exist for this branch (i.e., is this a repeat round?)
      MERGED_COUNT=$(echo "${EXISTING_MRS}" | jq '[.[] | select(.state == "merged")] | length')

      if [ "${MERGED_COUNT}" -gt 0 ]; then
        # Repeat round on a reused branch — disambiguate title/message with short SHA
        TITLE="[${JIRA_KEY}] ${SUMMARY} (${SHORT_SHA}) | [DEV]"
        SQUASH_MSG="[${JIRA_KEY}] ${SUMMARY} (${SHORT_SHA})"
        echo "In if merged count"
      else
        # First round on this branch
        TITLE="[${JIRA_KEY}] ${SUMMARY} | [DEV]"
        SQUASH_MSG="[${JIRA_KEY}] ${SUMMARY}"
        echo "In else merged count"
      fi
      echo ${SQUASH_MSG}

      # Check for an already-OPEN MR to avoid creating a duplicate (reuse instead)
      OPEN_MR_IID=$(echo "${EXISTING_MRS}" | jq '[.[] | select(.state == "opened")] | .[0].iid // empty')

      if [ -n "${OPEN_MR_IID}" ]; then
        echo "Open MR !${OPEN_MR_IID} already exists for ${SOURCE_BRANCH} — updating title/squash message only"
        curl --insecure --request PUT "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${OPEN_MR_IID}" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "title=${TITLE}" \
          --data-urlencode "squash_commit_message=${SQUASH_MSG}"
          echo "In if already exist"
      else
        echo "Creating new MR for ${SOURCE_BRANCH}"
        RESPONSE=$(curl --insecure --request POST "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "source_branch=${SOURCE_BRANCH}" \
          --data-urlencode "target_branch=test-gerrit-generate-dev" \
          --data-urlencode "title=${TITLE}" \
          --data-urlencode "squash_commit_message=${SQUASH_MSG}" \
          --data-urlencode "squash=true" \
          --data-urlencode "auto_merge=true")
          echo "In else of creating new"

        NEW_IID=$(echo "${RESPONSE}" | jq '.iid // empty')

        if [ -z "${NEW_IID}" ]; then
          # 409-style race: another job created it between our check and our POST.
          # Re-fetch by source_branch rather than parsing the error body (per your existing pattern)
          NEW_IID=$(curl --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${SOURCE_BRANCH}&target_branch=test-gerrit-generate-dev&state=opened" \
            | jq '.[0].iid // empty')
            echo "In IF no new id"
        fi

        echo "MR IID: ${NEW_IID}"
      fi

      # Resetting Title for TESET
      TITLE="[${JIRA_KEY}] ${SUMMARY}"

      # =====================================================================
      # SECOND MR: source_branch -> test  (squash, DRAFT, standby for UAT)
      # No auto_merge param at all — must only be merged by a deliberate
      # human action once status::validated-on-dev is confirmed.
      # =====================================================================
      echo "Checking existing test MR's"
      TEST_TARGET_BRANCH="development"   # <-- confirm this matches your actual UAT-bound branch name

      # GitLab recognizes a leading "Draft: " title prefix and sets draft=true automatically
      TEST_TITLE="Draft: [${JIRA_KEY}] ${SUMMARY} | [UAT]"
      TEST_SQUASH_MSG="${SQUASH_MSG}"   # squash message stays clean — no "Draft:" baked into test history

      echo "-------------${TEST_TITLE}-----------------""

      EXISTING_TEST_MRS=$(curl --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${SOURCE_BRANCH}&target_branch=${TEST_TARGET_BRANCH}&state=all")
      echo ${EXISTING_TEST_MRS}
      echo "-------------${TEST_TITLE}-----------------""
      OPEN_TEST_MR_IID=$(echo "${EXISTING_TEST_MRS}" | jq '[.[] | select(.state == "opened")] | .[0].iid // empty')

      if [ -n "${OPEN_TEST_MR_IID}" ]; then
        echo "Open test MR !${OPEN_TEST_MR_IID} already exists for ${SOURCE_BRANCH} — updating title/squash message only"
        curl --insecure --request PUT "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${OPEN_TEST_MR_IID}" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "title=${TEST_TITLE}" \
          --data-urlencode "squash_commit_message=${TEST_SQUASH_MSG}"
          echo "In if test MR already exists"
      else
        echo "Creating new standby MR for ${SOURCE_BRANCH} -> ${TEST_TARGET_BRANCH} (draft)"
        TEST_RESPONSE=$(curl --insecure --request POST "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests" \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --data-urlencode "source_branch=${SOURCE_BRANCH}" \
          --data-urlencode "target_branch=${TEST_TARGET_BRANCH}" \
          --data-urlencode "title=${TEST_TITLE}" \
          --data-urlencode "squash_commit_message=${TEST_SQUASH_MSG}" \
          --data-urlencode "squash=true")
          echo "In else of creating new test MR"

        NEW_TEST_IID=$(echo "${TEST_RESPONSE}" | jq '.iid // empty')

        if [ -z "${NEW_TEST_IID}" ]; then
          # Same 409-style race handling as the dev MR block above
          NEW_TEST_IID=$(curl --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${SOURCE_BRANCH}&target_branch=${TEST_TARGET_BRANCH}&state=opened" \
            | jq '.[0].iid // empty')
            echo "In IF no new test id"
        fi

        echo "test MR IID (draft/standby): ${NEW_TEST_IID}"
      fi



      # MR_TITLE="${CI_COMMIT_REF_NAME}" 

      # MR_IID=$(curl --fail --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${CI_COMMIT_REF_NAME}&state=opened"| jq -r '.[0].iid')

      # echo "MERGE IID ${MR_IID}"
      # # * Checks if the merge request already exists, if not it creates a new merge request with the current branch as source and test-gerrit-generate-dev as target
      # if [ -z "$MR_IID" ] || [ "$MR_IID" == "null" ]; then
      #   echo "IN IF STATEMENT ---"
      # curl --fail --insecure -X POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" --data '{"source_branch":   "'"${CI_COMMIT_REF_NAME}"'","target_branch": "test-gerrit-generate-dev","title": "'"${MR_TITLE}"'","squash": true}' "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
      # echo "IN ELSE STATEMENT"
      # fi
      # MR_IID=$(curl --fail --insecure --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${CI_COMMIT_REF_NAME}&state=opened"| jq -r '.[0].iid')

      # curl --fail --insecure -X PUT --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" --data '{"auto_merge": true}' "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge"
  retry: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: always

fortify_version_create:
  image: docker-registry.c2sf.mil/cmis/rockylinux:latest
  stage: fortify
  needs: [] # <-- no dependency on fortify_version_create, starts immediately

  before_script:
    - mkdir -p $HOME/.docker
    - echo $DOCKER_AUTH_CONFIG > $HOME/.docker/config.json

  script:
    - echo "Creating OR validating version has been created"
    - export VERSION=$CI_COMMIT_REF_NAME
    - echo $VERSION
    - echo $CI_COMMIT_REF_NAME
    - |

      if [[ $MR_ID != "" ]]; then
        VERSION=$MR_ID
        fi

      # curl --insecure -X 'POST'  "https://fortify.c2sf.mil/api/v1/projectVersions"   -H "accept: application/json"   -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}"   -H "Content-Type: application/json"   -d '{ "name" : "'"$VERSION"'" , "active" : true, "committed": false, "project" : { "id" : "184" }, "issueTemplateId": "Prioritized-HighRisk-Project-Template" }' > version_create.json 
                        curl --insecure -X 'POST' 'https://fortify.c2sf.mil/api/v1/projectVersions' \
        -H 'accept: application/json' \
        -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
        -H 'Content-Type: application/json' \
        -d '{
          "name": "'"$VERSION"'",
          "active": true,
          "committed": false,
          "project": { "id": 184 },
          "issueTemplateId": "Prioritized-HighRisk-Project-Template"
        }' > version_create.json
    - |
      curl --insecure -X "GET" "https://fortify.c2sf.mil/api/v1/projectVersions?q=name:$VERSION&projectId=184" -H "accept: application/json" -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" -H "Content-Type: application/json" > app.json
    - |


      echo "Checking version existance"
      ls -l app.json
      cat app.json | jq


      if [[ "$(cat app.json | jq -c .responseCode)" -eq "200" ]]; then
        echo "Connection succeeded"

        if [[ $(cat app.json | jq .count) -eq "0" ]]; then
            echo "Creating new version"
            # curl --insecure -X 'POST'   'https://fortify.c2sf.mil/api/v1/projectVersions'   -H 'accept: application/json'   -H 'Authorization: FortifyToken ${FORTIFY_API_TOKEN}'   -H 'Content-Type: application/json'   -d '{ "name" : "'"$VERSION"'" , "active" : true, "committed": false, "project" : { "id" : 184 }, "issueTemplateId": "Prioritized-HighRisk-Project-Template","attributeDefinitionId": "Development Phase","values": [{"value": "New"}] }' > version_create.json
                  curl --insecure -X 'POST' 'https://fortify.c2sf.mil/api/v1/projectVersions' \
        -H 'accept: application/json' \
        -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
        -H 'Content-Type: application/json' \
        -d '{
          "name": "'"$VERSION"'",
          "active": true,
          "committed": false,
          "project": { "id": 184 },
          "issueTemplateId": "Prioritized-HighRisk-Project-Template"
        }' > version_create.json
          # Extract the new version's ID from the create response
            numerical_id=$( jq -r '.data.id' version_create.json )

        curl --insecure -X 'PUT' "https://fortify.c2sf.mil/api/v1/projectVersions/${numerical_id}/attributes" \
          -H 'accept: application/json' \
          -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
          -H 'Content-Type: application/json' \
          -d '[
            {
              "attributeDefinitionId": "Development Phase",
              "values": [{"value": "New"}]
            }
          ]'


              cat version_create.json


            ls -l version_create.json
        fi
          echo "Outputing info"
        if [[ -f version_create.json ]]; then

          if [[ "$( cat version_create.json | jq -c '.responseCode' )" -eq "201" && "$( cat version_create.json | jq -c '.data.name' | tr -d '"' )" == "$VERSION" ]]; then
            cat version_create.json | jq '.'
            echo "Success on creation"
            echo "Name of version:" $( jq -c ".data.name" version_create.json)
            echo "Response code:" $( jq -c ".responseCode" version_create.json)
            id_creation=$( jq -c ".data.id" version_create.json)
            numerical_id=$( jq -c ".data.id" version_create.json)
          
          elif [[ "$( cat version_create.json | jq -c '.responseCode' )" -eq "400" && "$( cat version_create.json | jq -c '.message' )" =~ "duplicate name" ]]; then
            echo "Version found will use and update"
            id_creation=$(cat app.json | jq -c '.data[]?.id' )  
          fi
        fi
      fi
        echo "almost done"

       echo "Adding new attributes to version"
       echo "################################"
       curl --insecure -X PUT "https://fortify.c2sf.mil/api/v1/projectVersions/$id_creation/attributes" -H "Authorization: FortifyToken $FORTIFY_API_TOKEN" -H "Content-Type: application/json" -H "accept: application/json" -d '[{"attributeDefinitionId": 5, "values": [{"guid": "Active"}], "value": null},{"attributeDefinitionId": 6, "values": [{"guid": "Internal"}], "value": null},{"attributeDefinitionId": 7, "values": [{"guid": "internalnetwork"}], "value": null}]'
       echo "################################"

        echo "##########################"
        echo "Committing $numerical_id"
        curl --insecure -X "PUT" "https://fortify.c2sf.mil/api/v1/projectVersions/$id_creation" -H "accept: application/json" -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" -H "Content-Type: application/json" -d '{ "committed" : true }' | jq
        echo "##########################"  
        exit 0
  retry: 2
  rules:
    # - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"'
    #   when: always
    - if: '$CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "gerrit-generated-dev"|| $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never # Do not run the pipeline for these branches

    - when: always # Run the pipeline for all other branches

  artifacts:
    paths:
      - app.json
      - version_create.json
      - /opt/fcli

fortify_scan: # This job runs in the build stage, which runs first.
  image: docker-registry.c2sf.mil/factory/fortify-sca:latest

  stage: fortify
  needs: ["fortify_version_create"] # <-- no dependency on fortify_version_create, starts immediately

  before_script:
    - curl -sSL -o $CI_BUILDS_DIR/$CI_PROJECT_PATH/fcli.tgz https://github.com/fortify/fcli/releases/download/latest/fcli-linux.tgz
    - tar -xzf $CI_BUILDS_DIR/$CI_PROJECT_PATH/fcli.tgz -C $CI_BUILDS_DIR/$CI_PROJECT_PATH/
    - chmod +x $CI_BUILDS_DIR/$CI_PROJECT_PATH/fcli
  script:
    - echo "Rules updates `fortifyupdate`"
    - git config --global --add safe.directory $CI_BUILDS_DIR/$CI_PROJECT_PATH
    - uname -a
    # - sudo apt-get install -y ca-certificates
    # - sudo cp local-ca.crt /usr/local/share/ca-certificates
    # - sudo update-ca-certificates

    - echo "Analyzing all files"
    - echo $CI_BUILDS_DIR
    - echo "Getting files to scan"
    - export files_to_scan=""
    - export file_count=0
    - |
      if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
          mapfile -t file_count < <(
              git show --pretty="format:" --name-only HEAD | sort -u
          )
      else
          mapfile -t file_count < <(
              git diff --name-only "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}" | sort -u
          )
      fi

      echo "$file_count"
      # file_count=(`git show --pretty="format:" --name-only`)

    - |
      if [[ $CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "gerrit-generated-dev" ]]; then
          files_to_scan="$CI_BUILDS_DIR/$CI_PROJECT_PATH/src/htdocs/**/*"
      else 
        # echo "in else --"
        echo ${#file_count[*]}
        echo " Post file count"
        for line in "${file_count[@]}"; do
              if [[ ${#file_count[*]} -gt "1" ]]; then 

                files_to_scan+="$line " 
              else
               files_to_scan+="$line"
              fi
          echo $line
        done
      fi

    # - sourceanalyzer -verbose -b srcbuild $CI_BUILDS_DIR/cmis/cmis/src/htdocs/**/*
    - sourceanalyzer -b srcbuild -clean
    - sourceanalyzer -verbose -b srcbuild -source-base-dir "$CI_PROJECT_DIR/src/htdocs" $files_to_scan
    - mkdir -p $CI_BUILDS_DIR/$CI_PROJECT_PATH/tmp
    - echo "Setting FPRNAME"
    - export FPRNAME=$(date +"%Y%m%d%H%M%S".fpr)
    - echo "Creating FPR file"
    - sourceanalyzer -verbose -b srcbuild -scan -f $FPRNAME
    - echo "Deploying application to fortify"
    - export VERSION=$CI_COMMIT_REF_NAME
    #- export VERSION="another-check15"
    - echo $VERSION
    - fortifyclient -debug -url $FORTIFY_URL -authtoken $FORTIFY_TOKEN uploadFPR -file $FPRNAME -application $PROJECT -applicationVersion $VERSION
    - |
      curl --insecure -X "GET" \
      "https://fortify.c2sf.mil/api/v1/projectVersions?q=name:$VERSION&projectId=184" \
      -H "accept: application/json" \
      -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
      -H "Content-Type: application/json" > $CI_BUILDS_DIR/$CI_PROJECT_PATH/tmp/app.json
  retry: 2
  rules:
    # - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"'
    #   when: always
    - if: '$CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "gerrit-generated-dev" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never # Do not run the pipeline for these branches

    - when: always # Run the pipeline for all other branches

  artifacts:
    paths:
      - $FPRNAME
      - tmp/
      - app.json
    expire_in: 1 week
    # - FPRUtility -information -listIssues -categoryIssueCounts -project $FPRNAME
    # - FPRUtility -information -listIssues -search -query "[fortify priority order]:critical || [fortify priority order]:high || [fortify priority order]:medium" -project $FPRNAME -outputFormat CSV -f vuln.csv

fortify_auto_approve:
  image: docker-registry.c2sf.mil/cmis/rockylinux:latest
  stage: auto_approve_artifact
  needs:
    - job: fortify_scan
      artifacts: true
  script:
    - echo "Auto-approving all issues in the FPR file"
    - |
      mv $CI_PROJECT_DIR/tmp/app.json $CI_PROJECT_DIR/app.json
      cd /opt
      tar -xvf fcli.tgz
      ls -ltrh $CI_PROJECT_DIR
      VERSION_ID=$(jq -r '.data[0].id' $CI_PROJECT_DIR/app.json)
      echo $VERSION_ID
      curl --insecure -X GET \
      "https://fortify.c2sf.mil/api/v1/projectVersions/${VERSION_ID}/artifacts" \
      -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
      -H "accept: application/json" > artifacts.json

      ARTIFACT_ID=($(jq -r '.data[] | select(.status=="REQUIRE_AUTH") | .id' artifacts.json))
      echo $ARTIFACT_ID
      if [[ ${#ARTIFACT_ID[@]} -eq 0 ]]; then
        echo "No artifacts needing Approval"
        exit 0
      fi

      cd /opt/
      ls -ltrh /opt/
      find * -iname '*fcli*'
        ./fcli ssc session login --url https://fortify.c2sf.mil --token $FORTIFY_API_TOKEN -k
        for line in ${ARTIFACT_ID[@]}; do
          echo "Approving artifact $line"
          ./fcli ssc artifact approve $line -m "Automated CI approval"
        done
        ./fcli ssc artifact approve $ARTIFACT_ID -m "Automated CI approval"

      # curl --insecure -X POST \
      # "https://fortify.c2sf.mil/api/v1/projectVersions/${VERSION_ID}/artifacts/${ARTIFACT_ID}/approve" \
      # -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" \
      # -H "Content-Type: application/json" \
      # -d '{"comment":"Automated CI approval"}'
  retry: 2
  rules:
    # - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"'
    #   when: always
    - if: '$CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "gerrit-generated-dev"'
      when: never # Do not run the pipeline for these branches
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always # Run the pipeline for all other branches

jira_ticket_apply_fortify_url:
  #image: docker-registry.c2sf.mil/ironbank/opensource/debian/debian:latest
  image: docker-registry.c2sf.mil/cmis/rockylinux:latest
  stage: jira_ticket_link_apply
  needs:
    - job: fortify_version_create
      artifacts: true
  script:
    # - |
    #  curl --insecure -X "GET" "https://fortify.c2sf.mil/api/v1/projectVersions?q=name:$VERSION&projectId=184" -H "accept: application/json" -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" -H "Content-Type: application/json" > app.json
    - |
      if [[ -f version_create.json || -f app.json ]]; then
          if [[ "$( cat version_create.json | jq -c '.responseCode' )" -eq "400" && "$( cat version_create.json | jq -c '.message' )" =~ "duplicate name" ]]; then
              echo "Version found will use app.json value"
              id_creation=$(cat app.json | jq -c '.data[].id' )
          else {
            id_creation=$(cat version_create.json | jq -c '.data?.id' )
          }
          fi
      fi
      export JIRA_BASE_URL="${JIRA_BASE}"
      export id_creation
      echo $id_creation
