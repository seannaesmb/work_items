internal_code_scan:
  #image: docker-registry.c2sf.mil/ironbank/opensource/debian/debian:latest
  image: docker-registry.c2sf.mil/cmis/rockylinux:latest
  stage: internal_code_scanners

  script:
    # - |
    #  curl --insecure -X "GET" "https://fortify.c2sf.mil/api/v1/projectVersions?q=name:$VERSION&projectId=184" -H "accept: application/json" -H "Authorization: FortifyToken ${FORTIFY_API_TOKEN}" -H "Content-Type: application/json" > app.json
    - |
      set -o pipefail
      export JIRA_BASE_URL="${JIRA_BASE}"

      cd $CI_PROJECT_DIR
      mkdir -p /tmp/codereview-results
      if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        # First push to branch — only HEAD's own diff is safe to inspect
        RAW_FILES=$(git diff-tree --no-commit-id --name-status -r -m --diff-filter=d $CI_COMMIT_SHA)
      else
        # Full range diff so multiple commits in one push are all captured, deduped naturally
        RAW_FILES=$(git diff $CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA --name-status --diff-filter=d)
      fi

      RAW_FILES=$(echo "$RAW_FILES" | awk '!seen[$2]++')

      tmp=($(echo "$RAW_FILES" \
        | sed -e 's/^R[[:space:]]\+[^ ]\+[[:space:]]\+/R/;s/^[[:alpha:]]\+[[:space:]]\+//' \
        | grep -i -e '\.cfm$' -e '\.cfc$' \
        | sed -ne 's|^src/htdocs/||p' \
        | sort -u || true))

      #tmp=($(git show $CI_COMMIT_SHA --format= --name-status --diff-filter=d | sed -e 's/^R[[:space:]]\+[^ ]\+[[:space:]]\+/R/;s/^[[:alpha:]]\+[[:space:]]\+//' | grep -i -e '\.cfm$' -e '\.cfc$' | sed -ne 's|^src/htdocs/||p'||true))
      echo ${#tmp[*]}
      if [[ ! ${#tmp[*]} -eq 0 ]]; then
        for line in ${tmp[*]}; do SAFE_NAME=$(echo "$line" | tr '/' '_'); echo $line; bash -x /app/bin/codereview.bash "" "$(git rev-parse --show-toplevel)/src/htdocs" "$line" > "/tmp/codereview-results/${SAFE_NAME}.json";
        [ $? -ne 0 ] && OVERALL_EXIT=1
        done
      fi

      export OVERALL_EXIT

      ## Python Section ##

      python3 - <<'PYEOF'
      import json, os, glob, subprocess

      all_issues    = []
      file_findings = []

      for f in glob.glob('/tmp/codereview-results/*.json'):
          filename = os.path.basename(f).replace('.json', '').replace('_', '/')
          try:
              with open(f) as fh:
                  data = json.load(fh)
          except Exception as e:
              print(f"WARNING: could not parse {f}: {e}")
              continue

          file_issues = []
          for finding in data.get('findings', []):
              line_no = finding.get('lineNumber', 0)
              msg     = finding.get('message', '') or ''
              if not msg:
                  continue
              if line_no:
                  file_issues.append(f"Line {line_no}: {msg}")
              else:
                  file_issues.append(msg)

          if file_issues:
              all_issues.extend(file_issues)
              file_findings.append({
                  'file':   filename,
                  'issues': "; ".join(file_issues)
              })
          else:
              file_findings.append({
                  'file':   filename,
                  'issues': ''
              })

      job_name    = os.environ.get('CI_JOB_NAME', 'unknown')
      output_file = f"{job_name}_scan_result.json"
      status      = 'failed' if all_issues else 'success'

      result = {
          'job':           job_name,
          'status':        status,
          'issues':        "; ".join(all_issues) if all_issues else "None",
          'file_findings': file_findings,
          'url':           os.environ.get('CI_JOB_URL', '')
      }

      with open(output_file, 'w') as f:
          json.dump(result, f)

      print(f"Written to: {output_file}")
      print(json.dumps(result, indent=2))
      PYEOF

